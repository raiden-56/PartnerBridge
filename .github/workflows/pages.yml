# Publishes a static, read-only preview of PartnerBridge (fictional demo data, guest mode)
# to GitHub Pages. GitHub Pages only serves files, so scripts/build-pages.ts runs the app
# in local demo mode during the build and saves every page.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # npm install (not ci): the lock file is generated on Windows and npm ci on Linux rejects
      # some platform-specific optional entries.
      - run: npm install --no-audit --no-fund
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build static preview
        run: npm run pages:build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_PUBLIC_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
